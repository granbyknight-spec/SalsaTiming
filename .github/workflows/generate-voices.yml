name: Generate ElevenLabs Voice Samples

on:
  workflow_dispatch: # Manual trigger from GitHub UI (phone-friendly!)

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg (for phrase slicing)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generate voice samples via ElevenLabs API
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/generateVoices.js

      - name: Verify all voice files exist (3 tiers x 12 cues = 36 files)
        run: |
          count=0
          for suffix in "" "_slow" "_fast"; do
            for f in voice_one voice_two voice_three voice_four voice_five \
                     voice_six voice_seven voice_eight voice_and_one voice_and_five \
                     voice_and_one_two_three voice_and_five_six_seven; do
              file="docs/assets/samples/${f}${suffix}.mp3"
              test -f "$file" || { echo "Missing: ${f}${suffix}.mp3"; exit 1; }
              count=$((count + 1))
            done
          done
          echo "All $count voice files verified."
          ls -la docs/assets/samples/voice_*.mp3

      - name: Commit and push generated voice samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/samples/voice_*.mp3 docs/assets/samples/voice_*.mp3
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Generate ElevenLabs voice samples (Daniel, 3 tiers, words + counting phrases)"
          git push
