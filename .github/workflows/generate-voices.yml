name: Generate ElevenLabs Voice Samples

on:
  workflow_dispatch: # Manual trigger from GitHub UI (phone-friendly!)

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate voice samples via ElevenLabs API
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/generateVoices.js

      - name: Verify all 10 voice files exist
        run: |
          for f in voice_one voice_two voice_three voice_four voice_five \
                   voice_six voice_seven voice_eight voice_and_one voice_and_five; do
            test -f "docs/assets/samples/${f}.mp3" || { echo "Missing: ${f}.mp3"; exit 1; }
          done
          echo "All 10 voice files verified."
          ls -la docs/assets/samples/voice_*.mp3

      - name: Commit and push generated voice samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/samples/voice_*.mp3 docs/assets/samples/voice_*.mp3
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Generate ElevenLabs voice samples (Rachel voice)"
          git push
