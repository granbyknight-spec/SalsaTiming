<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- 
      This viewport works for phones with notches.
      It's optimized for gestures by disabling global zoom.
     -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.00001, viewport-fit=cover"
    />
    <title>Salsa On2 and On1 Timing</title>
    <style>
      /**
       * Extend the react-native-web reset:
       * https://github.com/necolas/react-native-web/blob/master/packages/react-native-web/src/exports/StyleSheet/initialRules.js
       */
      html,
      body,
      #root {
        width: 100%;
        /* To smooth any scrolling behavior */
        -webkit-overflow-scrolling: touch;
        margin: 0px;
        padding: 0px;
        /* Allows content to fill the viewport and go beyond the bottom */
        min-height: 100%;
      }
      #root {
        flex-shrink: 0;
        flex-basis: auto;
        flex-grow: 1;
        display: flex;
        flex: 1;
      }

      html {
        scroll-behavior: smooth;
        /* Prevent text size change on orientation change https://gist.github.com/tfausak/2222823#file-ios-8-web-app-html-L138 */
        -webkit-text-size-adjust: 100%;
        height: calc(100% + env(safe-area-inset-top));
      }

      body {
        display: flex;
        /* Allows you to scroll below the viewport; default value is visible */
        overflow-y: auto;
        overscroll-behavior-y: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -ms-overflow-style: scrollbar;
      }
      /* Enable for apps that support dark-theme */
      /*@media (prefers-color-scheme: dark) {
        body {
          background-color: black;
        }
      }*/
    </style>
  </head>

  <body>
    <!-- 
      A generic no script element with a reload button and a message.
      Feel free to customize this however you'd like.
    -->
    <noscript>
      <form
        action=""
        style="
          background-color: #fff;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 9999;
        "
      >
        <div
          style="
            font-size: 18px;
            font-family: Helvetica, sans-serif;
            line-height: 24px;
            margin: 10%;
            width: 80%;
          "
        >
          <p>Oh no! It looks like JavaScript is not enabled in your browser.</p>
          <p style="margin: 20px 0;">
            <button
              type="submit"
              style="
                background-color: #4630eb;
                border-radius: 100px;
                border: none;
                box-shadow: none;
                color: #fff;
                cursor: pointer;
                font-weight: bold;
                line-height: 20px;
                padding: 6px 16px;
              "
            >
              Reload
            </button>
          </p>
        </div>
      </form>
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="diag" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#1a1a2e;color:#fff;font-family:Helvetica,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:24px;text-align:center;">
      <p style="font-size:20px;font-weight:700;">Loading Salsa Timing...</p>
      <p id="diag-status" style="font-size:13px;color:#8899aa;margin-top:8px;">Waiting for JS bundle...</p>
    </div>
    <script>
      // Diagnostic: catch any errors before/during bundle load
      window.onerror = function(msg, src, line, col, err) {
        var d = document.getElementById('diag');
        if (d) {
          d.innerHTML = '<p style="font-size:20px;font-weight:700;color:#e94560;">JS Error</p>' +
            '<p style="font-size:14px;color:#ccc;margin-top:12px;word-break:break-all;">' + msg + '</p>' +
            '<p style="font-size:12px;color:#8899aa;margin-top:8px;">Source: ' + (src||'unknown') + ':' + (line||'?') + '</p>';
        }
      };
      window.addEventListener('unhandledrejection', function(e) {
        var d = document.getElementById('diag');
        if (d) {
          d.innerHTML = '<p style="font-size:20px;font-weight:700;color:#e94560;">Promise Error</p>' +
            '<p style="font-size:14px;color:#ccc;margin-top:12px;word-break:break-all;">' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)) + '</p>';
        }
      });
      // Hide diagnostic overlay once React renders content into #root
      var obs = new MutationObserver(function() {
        var root = document.getElementById('root');
        if (root && root.children.length > 0) {
          var d = document.getElementById('diag');
          if (d) d.style.display = 'none';
          obs.disconnect();
        }
      });
      obs.observe(document.getElementById('root'), { childList: true });
    </script>
    <script>document.getElementById('diag-status').textContent = 'Bundle loading...';</script>
    <script src="/SalsaTiming/expo/static/js/web/index-2cdf6c5cdb19b17e627c048da675dda1.js" defer></script>
</body>
</html>
